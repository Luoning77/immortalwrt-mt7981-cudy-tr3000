name: ImmortalWrt Builder

permissions:
  contents: write

on:
  push:
    branches:
      - build/no-clash-ua3f-128u
  workflow_dispatch:
    inputs:
      device:
        description: '编译设备型号'
        required: true
        type: choice
        default: '128M-Ubootmod'
        options:
          - '128M-Ubootmod'
      repo:
        description: '指定源码仓库地址'
        required: true
        type: string
        default: 'https://github.com/padavanonly/immortalwrt-mt798x-6.6'
      commit:
        description: '指定源码提交，留空使用已锁定的提交'
        required: false
        type: string
        default: ''
      ssh:
        description: '是否通过 SSH 执行 make menuconfig'
        required: false
        type: boolean
        default: false
      release:
        description: '是否发布编译产物到 Release'
        required: false
        type: boolean
        default: true
      prerelease:
        description: '是否发布为预发布版本 (Pre-release)'
        required: false
        type: boolean
        default: false

env:
  DEVICE_INPUT: ${{ github.event.inputs.device || '128M-Ubootmod' }}
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 2G
  REPO_URL: ${{ github.event.inputs.repo || 'https://github.com/padavanonly/immortalwrt-mt798x-6.6' }}
  REPO_BRANCH: openwrt-24.10-6.6
  REPO_COMMIT: ${{ inputs.commit || 'ec9ef10efc65da1e6d1de4e2c043c0e13d08eed8' }}
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_RELEASE: ${{ github.event.inputs.release }}
  PRERELEASE: ${{ github.event.inputs.prerelease }}
  TZ: Asia/Shanghai

jobs:
  menuconfig:
    name: ⚙️ Menuconfig & Push
    if: github.ref == 'refs/heads/build/no-clash-ua3f-128u' && inputs.ssh
    outputs:
      commit: ${{ steps.save_config.outputs.commit }}
    runs-on: ubuntu-22.04
    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v4

      - name: Validate device and load firmware version
        run: |
          test "$DEVICE_INPUT" = "128M-Ubootmod" || { echo "Only 128M-Ubootmod is supported"; exit 1; }
          VERSION=$(sed -n 's/^FIRMWARE_VERSION:=//p' package/proxy-versions.mk)
          [[ "$VERSION" =~ ^[0-9]{2}\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "FIRMWARE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 🛠️ Init Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libncurses-dev build-essential git wget python3 bzip2
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          [[ "$REPO_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git clone --no-checkout --depth=1 --single-branch --branch "$REPO_BRANCH" -- "$REPO_URL" openwrt
          git -C openwrt fetch --depth=1 origin "$REPO_COMMIT"
          git -C openwrt checkout --detach "$REPO_COMMIT"
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 🔧 Set device variables
        run: |
          case "$DEVICE_INPUT" in
            "128M-Ubootmod") echo "CONFIG_FILE=config/128muboot.config" >> $GITHUB_ENV ;;
          esac

      - name: 👩‍💻 Copy previous config if exists
        run: |
          if [ -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" ]; then
            cp -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" /workdir/openwrt/.config
          fi

      - name: ⚙️ Load custom feeds
        run: |
          cp "$FEEDS_CONF" openwrt/feeds.conf.default
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P1_SH"

      - name: 🧬 Update & Install feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: 🧩 Load custom configuration
        run: |
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: ⌨️ SSH connection to Menuconfig
        uses: owenthereal/action-upterm@v1.15.0
        timeout-minutes: 15
        with:
          limit-access-to-actor: true
          upterm-version: v0.29.0
          
      - name: 📤 Save config on the build branch
        id: save_config
        run: |
          SRC="/workdir/openwrt/.config"
          DST="$GITHUB_WORKSPACE/${CONFIG_FILE}"
          mkdir -p "$(dirname "$DST")"
          cp -f "$SRC" "$DST"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_FILE"
          
          if ! git diff --cached --quiet; then
            git commit -m "Update config: ${CONFIG_FILE}"
            git push origin "HEAD:$GITHUB_REF"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: 🔨 Build Firmware
    needs: menuconfig
    if: always() && github.ref == 'refs/heads/build/no-clash-ua3f-128u' && (needs.menuconfig.result == 'success' || needs.menuconfig.result == 'skipped')
    runs-on: ubuntu-22.04
    
    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.menuconfig.outputs.commit || github.sha }}
          persist-credentials: false

      - name: 🪠 Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Validate device and load firmware version
        run: |
          test "$DEVICE_INPUT" = "128M-Ubootmod" || { echo "Only 128M-Ubootmod is supported"; exit 1; }
          VERSION=$(sed -n 's/^FIRMWARE_VERSION:=//p' package/proxy-versions.mk)
          [[ "$VERSION" =~ ^[0-9]{2}\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "FIRMWARE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 🛠️ Init Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          [[ "$REPO_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git clone --no-checkout --depth=1 --single-branch --branch "$REPO_BRANCH" -- "$REPO_URL" openwrt
          git -C openwrt fetch --depth=1 origin "$REPO_COMMIT"
          git -C openwrt checkout --detach "$REPO_COMMIT"
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: ⚙️ Setup ccache & DL cache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-${{ hashFiles('config/128muboot.config', 'feeds.conf.default', 'diy-part1.sh', 'package/proxy-versions.mk') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-

      - name: 🔧 Configure ccache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache -z

      - name: 🧬 Update & Install feeds
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/$FEEDS_CONF" feeds.conf.default
          bash "$GITHUB_WORKSPACE/$DIY_P1_SH"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH"

      - name: 🔨 Compile 128M Ubootmod Firmware (UA3F only)
        id: compile
        run: |
          set -euo pipefail
          cd /workdir/openwrt
          cp "$GITHUB_WORKSPACE/config/128muboot.config" .config
          make defconfig

          required_packages=(
            ua3f luci-compat firewall4 nftables-json ip-full iptables-nft
            kmod-nft-tproxy kmod-nft-socket kmod-nft-queue kmod-nfnetlink-queue
            kmod-ipt-nfqueue iptables-mod-nfqueue kmod-nf-conntrack-netlink
            kmod-sched-core kmod-sched-bpf tc-full bpftool-minimal
          )
          forbidden='luci-app-openclash(-[[:alnum:]_-]+)?|luci-i18n-openclash(-[[:alnum:]_-]+)?|(mihomo|clash)(-[[:alnum:]_-]+)?|tc-tiny|luci-compat-keep|ruby(-[[:alnum:]_-]+)?|libruby|chinadns-ng|dns2socks|microsocks|ipt2socks|kmod-mtd-rw'
          grep -Fxq 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y' .config
          for package in "${required_packages[@]}"; do
            grep -Fxq "CONFIG_PACKAGE_${package}=y" .config || { echo "Missing required package: $package"; exit 1; }
          done
          if grep -E "^CONFIG_PACKAGE_($forbidden)=[ym]$" .config; then
            echo "Unexpected package selected"
            exit 1
          fi

          make download -j"$(nproc)"
          if ! make -j"$(nproc)" CC="ccache gcc" CXX="ccache g++"; then
            make -j1 V=s
          fi

          shopt -s nullglob
          images=(bin/targets/mediatek/filogic/*cudy_tr3000-v1-ubootmod*sysupgrade.bin)
          manifests=(bin/targets/mediatek/filogic/*.manifest)
          if (( ${#images[@]} != 1 || ${#manifests[@]} != 1 )); then
            echo "Expected one TR3000 Ubootmod image and one package manifest"
            exit 1
          fi
          image="${images[0]}"
          manifest="${manifests[0]}"
          if awk '{print $1}' "$manifest" | grep -E "^($forbidden)$"; then
            echo "Unexpected package in the firmware image"
            exit 1
          fi
          for package in "${required_packages[@]}"; do
            awk -v expected="$package" '$1 == expected { found=1 } END { exit !found }' "$manifest" || {
              echo "Missing package in the firmware image: $package"
              exit 1
            }
          done

          collection="$GITHUB_WORKSPACE/firmware_collection"
          mkdir -p "$collection"
          cp "$image" "$manifest" "$collection/"
          cp .config "$collection/build.config"
          {
            echo "Firmware version: $FIRMWARE_VERSION"
            echo "Build recipe: $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "Firmware source: $(git rev-parse HEAD)"
            wc -c "$image"
            for source in feeds/packages feeds/luci feeds/routing feeds/telephony; do
              echo "$source: $(git -C "$source" rev-parse HEAD)"
            done
          } | tee "$collection/build-info.txt"
          (cd "$collection" && sha256sum -- *.bin > sha256sums)
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 🪄 Upload Binaries (Artifacts)
        uses: actions/upload-artifact@v4
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_${{ env.FIRMWARE_VERSION }}_${{ env.DEVICE_INPUT }}
          path: ${{ github.workspace }}/firmware_collection/*
          if-no-files-found: error

      - name: 📌 Generate Release Tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          RELEASE_TAG="ImmortalWrt-${FIRMWARE_VERSION}-${BUILD_TIME}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cat > release.txt << EOF
          ## 📦 ImmortalWrt Firmware Release

          **🏷️ Release:** $RELEASE_TAG
          **🌿 Branch:** $REPO_BRANCH
          **📱 Device:** ${DEVICE_INPUT}
          **📅 Build Date:** $(date +"%Y-%m-%d %H:%M:%S")
          **🔨 Compiler:** GCC with ccache

          ## 📥 Download

          Download the firmware files from the assets below.

          ---

          Built with ❤️ using [GitHub Actions](https://github.com/features/actions)
          EOF

          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          fail_on_unmatched_files: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: ${{ github.workspace }}/firmware_collection/*
